<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Muscular y Ejercicios - KineConnect</title>
    <link rel="stylesheet" href="public/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .seccion-header-acordeon {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            cursor: pointer;
            user-select: none;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--gris-50, #f8fafc);
            border: 1px solid var(--gris-200);
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .seccion-header-acordeon:hover {
            border-color: #0284c7;
        }
        [data-theme="dark"] .seccion-header-acordeon {
            background: #0f1929;
            border-color: #24344d;
        }
        .letra-pill-btn {
            min-width: 30px;
            height: 28px;
            padding: 0 8px;
            border-radius: 7px;
            border: 1px solid var(--gris-200);
            background: var(--blanco, #fff);
            color: var(--azul-900);
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.14s ease;
        }
        .letra-pill-btn:hover,
        .letra-pill-btn.activa {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
        }
        [data-theme="dark"] .letra-pill-btn {
            background: #162236;
            border-color: #24344d;
            color: #f8fafc;
        }
        [data-theme="dark"] .letra-pill-btn.activa {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
        }
        .btn-prescribir-card {
            background: #e0f2fe !important;
            border: 1px solid #7dd3fc !important;
            color: #0369a1 !important;
            font-weight: 700 !important;
        }
        .btn-prescribir-card:hover {
            background: #bae6fd !important;
            color: #0c4a6e !important;
        }
        [data-theme="dark"] .btn-prescribir-card {
            background: rgba(14, 165, 233, 0.16) !important;
            border-color: rgba(56, 189, 248, 0.4) !important;
            color: #7dd3fc !important;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <main class="main">
            <div class="content">

                <!-- Encabezado de la página -->
                <div class="page-header">
                    <div>
                        <h2>Catálogo Muscular y Ejercicios</h2>
<p>Consulta y filtra la biblioteca biomecánica y clínica de ejercicios terapéuticos.</p>                    </div>
                    <a href="crear_pauta.html" class="btn btn-primary">
                        <i class='bx bx-plus'></i> Prescribir Pauta
                    </a>
                </div>

                <!-- Panel de Búsqueda y Filtros -->
                <div class="card" style="margin-bottom: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">

                    <!-- Fila 1: Buscador ancho + Controles rápidos -->
                    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                        <div style="position: relative; flex: 1 1 320px; min-width: 240px;">
                            <i class='bx bx-search' style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gris-400); font-size: 1.05rem; pointer-events: none;"></i>
                            <input type="text" id="input-buscar-catalogo"
                                placeholder="Buscar ejercicio por nombre, zona o condición..."
                                oninput="filtrarPorTexto()"
                                style="width: 100%; box-sizing: border-box; padding: 9px 12px 9px 36px; border-radius: 8px; border: 1px solid var(--gris-200); font-size: 0.88rem; color: var(--azul-900); background: #fff; outline: none;">
                        </div>

                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <button type="button" id="btn-solo-video" class="btn btn-secondary btn-sm" onclick="toggleSoloConVideo()">
                                <i class='bx bx-video'></i> Solo con video
                            </button>

                            <select id="select-orden-catalogo" onchange="cambiarOrdenCatalogo(this.value)"
                                title="Modo de visualización"
                                style="padding: 7px 12px; border-radius: 8px; border: 1px solid var(--gris-200); font-size: 0.83rem; font-weight: 600; color: var(--azul-900); background: #fff; cursor: pointer;">
                                <option value="zona">Agrupado por Zona</option>
                                <option value="alfabetico">Alfabético (A–Z por Letra)</option>
                                <option value="video">Con Video primero</option>
                            </select>

                            <button type="button" id="btn-limpiar-filtros" class="btn btn-secondary btn-sm"
                                onclick="limpiarTodosLosFiltros()" style="display: none;">
                                <i class='bx bx-reset'></i> Limpiar
                            </button>
                        </div>
                    </div>

                    <!-- Fila 2: Zona Anatómica -->
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--gris-100);">
                        <span style="font-size: 0.83rem; font-weight: 700; color: var(--azul-900); margin-right: 4px; white-space: nowrap;">
                            <i class='bx bx-body'></i> Zona:
                        </span>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;" id="filtros-zonas-container">
                            <button type="button" class="filtro-biomecanico-pill activo-todos" onclick="filtrarPorZona('todos', this)">Todas</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('cuello', this)">Cuello</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('hombro', this)">Hombro</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('brazos', this)">Brazos / Muñeca</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('pecho', this)">Pecho</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('espalda', this)">Espalda</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('core', this)">Core</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('cadera', this)">Cadera / Glúteos</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('piernas', this)">Piernas</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('rodilla', this)">Rodilla</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('tobillo', this)">Tobillo / Pie</button>
                        </div>
                    </div>

                    <!-- Fila 3: Condición / Área Clínica -->
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--gris-100);">
                        <span style="font-size: 0.83rem; font-weight: 700; color: #0369a1; margin-right: 4px; white-space: nowrap;">
                            <i class='bx bx-plus-medical'></i> Área Clínica:
                        </span>
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;" id="filtros-clinicos-container">
                            <button type="button" class="filtro-biomecanico-pill activo-todos" onclick="filtrarPorArea('todos', this)">Todas</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('general', this)">Rehabilitación General</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('traumatologia', this)">Traumatología</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('neurologia', this)">Neurorehabilitación</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('post operatorio', this)">Post-Operatorio</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('cardiorrespiratorio', this)">Cardiorrespiratorio</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('geriatria', this)">Adulto Mayor</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('inmunologia', this)">Inmunología / VIH-SIDA</button>
                        </div>
                    </div>

                    <!-- Barra rápida por Inicial (se muestra en modo Alfabético) -->
                    <div id="barra-filtro-letras" style="display: none; align-items: center; gap: 6px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--gris-100);">
                        <span style="font-size: 0.82rem; font-weight: 700; color: var(--azul-900); margin-right: 4px;">
                            <i class='bx bx-sort-a-z'></i> Letra:
                        </span>
                        <div id="contenedor-pills-letras" style="display: flex; gap: 5px; flex-wrap: wrap;"></div>
                    </div>

                    <!-- Fila 4: Contador + Contraer/Expandir secciones -->
                    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-top: 10px; border-top: 1px solid var(--gris-100);">
                        <span id="contador-resultados-catalogo" style="font-size: 0.83rem; font-weight: 600; color: var(--gris-600);">
                            Cargando ejercicios...
                        </span>
                        <button type="button" id="btn-toggle-secciones" class="btn btn-secondary btn-sm"
                            onclick="toggleTodasLasSecciones()" style="display: none; font-size: 0.78rem; padding: 4px 10px;">
                            <i class='bx bx-collapse-vertical'></i> Contraer secciones
                        </button>
                    </div>
                </div>

                <!-- Lista / Cuadrícula de Ejercicios -->
                <div class="card" style="padding: 20px;">
                    <div id="loading-ejercicios" class="empty-state">
                        <i class='bx bx-loader-alt bx-spin loading-icon'></i>
                        <p class="loading-text">Cargando catálogo biomecánico...</p>
                    </div>

                    <div id="grid-catalogo-ejercicios" style="display: none;"></div>

                    <div id="no-ejercicios" class="empty-state" style="display: none;">
                        <i class='bx bx-dumbbell empty-icon'></i>
                        <p class="empty-text">No se encontraron ejercicios con los filtros seleccionados.</p>
                    </div>

                    <div id="error-ejercicios" class="empty-state" style="display: none;">
                        <i class='bx bx-error-circle error-icon'></i>
                        <p id="error-text" class="error-msg-text"></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Reproductor de Video -->
    <div id="modal-video-ejercicio" onclick="if(event.target === this) cerrarModalVideo()"
        style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
        <div class="card" style="width: 100%; max-width: 720px; padding: 20px; position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 id="modal-video-titulo" style="margin: 0; color: var(--azul-900); font-size: 1.1rem;">Demostración</h3>
                <button type="button" class="btn btn-secondary btn-sm" onclick="cerrarModalVideo()">
                    <i class='bx bx-x'></i> Cerrar
                </button>
            </div>
            <video id="reproductor-ejercicio" controls playsinline style="width: 100%; max-height: 70vh; border-radius: 8px; background: #000;">
                Tu navegador no soporta la reproducción de video MP4.
            </video>
        </div>
    </div>

    <!-- Modal Información Clínica del Ejercicio -->
    <div id="modal-info-ejercicio" onclick="if(event.target === this) cerrarModalInfo()"
        style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
        <div class="card" style="width: 100%; max-width: 560px; padding: 24px; position: relative; max-height: 85vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--gris-100);">
                <div>
                    <h3 id="modal-info-titulo" style="margin: 0 0 8px 0; color: var(--azul-900); font-size: 1.15rem;"></h3>
                    <div id="modal-info-badges" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="cerrarModalInfo()">
                    <i class='bx bx-x'></i> Cerrar
                </button>
            </div>
            <div id="modal-info-contenido" style="font-size: 0.92rem; color: var(--gris-700); line-height: 1.6;"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <script>
        let catalogoCompleto = [];
        let listaRenderizadaActual = [];
        let zonaFiltroActual = 'todos';
        let areaFiltroActual = 'todos';
        let letraFiltroActual = 'todas';
        let soloConVideoActual = false;
        let ordenActual = 'zona';
        let seccionesContraidas = false;

        const ORDEN_ZONAS_CLINICAS = [
            'Cuello',
            'Hombro',
            'Brazos / Muñeca',
            'Pecho',
            'Espalda',
            'Core / Lumbar',
            'Cadera / Glúteos',
            'Piernas / Rodilla',
            'Tobillo / Pie',
            'Otras Zonas',
        ];

        function escaparHtml(txt) {
            return String(txt ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function normalizarTexto(txt) {
            return String(txt ?? '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[-_]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function normalizarEtiquetaArea(raw) {
            const limpia = String(raw || '').trim();
            const clave = normalizarTexto(limpia);
            if (!clave) return '';
            if (clave === 'post operatorio') return 'Post-Operatorio';
            if (clave === 'rehabilitacion general') return 'Rehabilitación General';
            if (clave === 'traumatologia') return 'Traumatología';
            if (clave === 'neurorehabilitacion' || clave === 'neurologia') return 'Neurorehabilitación';
            if (clave === 'cardiorrespiratorio') return 'Cardiorrespiratorio';
            if (clave === 'geriatria' || clave === 'adulto mayor') return 'Adulto Mayor';
            if (clave.includes('inmunologia')) return 'Inmunología / VIH-SIDA';
            return limpia;
        }

        function obtenerLetraInicial(item) {
            const nombre = String(item.nombre || item.titulo || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toUpperCase();
            const primera = nombre.charAt(0);
            return /[A-Z]/.test(primera) ? primera : '#';
        }

        function obtenerGrupoZona(item) {
            const z = normalizarTexto(item.zona_cuerpo || item.zona_corporal || item.grupo_muscular);
            if (z.includes('cuello') || z.includes('cervical')) return 'Cuello';
            if (z.includes('hombro') || z.includes('escapul')) return 'Hombro';
            if (z.includes('brazo') || z.includes('muneca') || z.includes('mano') || z.includes('antebrazo') || z.includes('biceps')) return 'Brazos / Muñeca';
            if (z.includes('pecho') || z.includes('pectoral') || z.includes('torax') || z.includes('costal')) return 'Pecho';
            if (z.includes('espalda') || z.includes('dorsal') || z.includes('toracic')) return 'Espalda';
            if (z.includes('core') || z.includes('lumbar') || z.includes('pelv')) return 'Core / Lumbar';
            if (z.includes('cadera') || z.includes('gluteo')) return 'Cadera / Glúteos';
            if (z.includes('pierna') || z.includes('rodilla') || z.includes('cuadriceps')) return 'Piernas / Rodilla';
            if (z.includes('tobillo') || z.includes('pie')) return 'Tobillo / Pie';
            return 'Otras Zonas';
        }

        function obtenerAreasEjercicio(item) {
            let rawAreas = [];
            if (Array.isArray(item.area_clinica) && item.area_clinica.length > 0) {
                rawAreas = item.area_clinica.map(a => (typeof a === 'object' ? (a.nombre || '') : String(a)));
            } else if (typeof item.area_clinica === 'string' && item.area_clinica.trim()) {
                rawAreas = [item.area_clinica];
            } else {
                rawAreas = ['Rehabilitación General'];
            }

            // Deduplica variantes como "POST OPERATORIO" y "POST-OPERATORIO"
            const unicas = new Map();
            rawAreas.forEach(a => {
                const normalizada = normalizarEtiquetaArea(a);
                const clave = normalizarTexto(normalizada);
                if (clave && !unicas.has(clave)) {
                    unicas.set(clave, normalizada);
                }
            });
            return unicas.size > 0 ? Array.from(unicas.values()) : ['Rehabilitación General'];
        }

        function toggleAreasExtra(btn) {
            const extra = btn.nextElementSibling;
            if (!extra) return;
            const oculto = extra.style.display === 'none';
            extra.style.display = oculto ? 'contents' : 'none';
            btn.textContent = oculto ? 'Ver menos' : btn.getAttribute('data-label');
        }

        function resolverUrlVideo(item) {
            let rawUrl =
                item.video ||
                item.archivo_video ||
                item.video_file ||
                item.video_mp4 ||
                item.url_multimedia ||
                item.video_url ||
                '';

            if (!rawUrl && item && typeof item === 'object') {
                const rutaDetectada = Object.values(item).find(
                    v => typeof v === 'string' && /\.(mp4|webm|mov)($|\?)/i.test(v)
                );
                if (rutaDetectada) rawUrl = rutaDetectada;
            }

            if (!rawUrl) return '';
            if (rawUrl.startsWith('http://') || rawUrl.startsWith('https://')) return rawUrl;
            return `${BACKEND_ORIGIN}${rawUrl.startsWith('/') ? '' : '/'}${rawUrl}`;
        }

        function formatearDescripcionClinica(texto) {
            let html = escaparHtml(texto || 'Sin descripción disponible para este ejercicio terapéutico.');
            const secciones = [
                'Posición inicial:',
                'Ejecución:',
                'Ritmo y respiración:',
                'Precaución postural:'
            ];
            secciones.forEach((titulo, idx) => {
                const salto = idx === 0 ? '' : '<br><br>';
                html = html.replace(
                    titulo,
                    `${salto}<strong style="color: var(--azul-900);">${titulo}</strong>`
                );
            });
            return html;
        }

        function abrirModalInfo(index) {
            const item = listaRenderizadaActual[index];
            if (!item) return;

            const nombre = item.nombre || item.titulo || 'Ejercicio Terapéutico';
            const zona = item.zona_cuerpo || item.zona_corporal || item.grupo_muscular || 'General';
            const areas = obtenerAreasEjercicio(item);

            document.getElementById('modal-info-titulo').textContent = nombre;
            document.getElementById('modal-info-badges').innerHTML = `
                <span class="badge badge-neutro"><i class='bx bx-body'></i> ${escaparHtml(zona)}</span>
                ${areas.map(a => `<span class="badge" style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;"><i class='bx bx-plus-medical'></i> ${escaparHtml(a)}</span>`).join('')}
            `;
            document.getElementById('modal-info-contenido').innerHTML = formatearDescripcionClinica(item.descripcion);
            document.getElementById('modal-info-ejercicio').style.display = 'flex';
        }

        function cerrarModalInfo() {
            document.getElementById('modal-info-ejercicio').style.display = 'none';
        }

        function abrirModalVideo(boton) {
            const titulo = boton.getAttribute('data-nombre') || 'Demostración';
            const url = boton.getAttribute('data-video');
            if (!url) return;

            const modal = document.getElementById('modal-video-ejercicio');
            const tituloEl = document.getElementById('modal-video-titulo');
            const videoEl = document.getElementById('reproductor-ejercicio');

            tituloEl.textContent = titulo;
            videoEl.pause();
            videoEl.src = url;
            videoEl.load();

            modal.style.display = 'flex';
            videoEl.play().catch(() => {});
        }

        function cerrarModalVideo() {
            const modal = document.getElementById('modal-video-ejercicio');
            const videoEl = document.getElementById('reproductor-ejercicio');

            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
            modal.style.display = 'none';
        }

        function ordenarEjercicios(lista, priorizarVideo = false) {
            return [...lista].sort((a, b) => {
                if (priorizarVideo) {
                    const va = resolverUrlVideo(a) ? 1 : 0;
                    const vb = resolverUrlVideo(b) ? 1 : 0;
                    if (vb !== va) return vb - va;
                }
                return (a.nombre || a.titulo || '').localeCompare(b.nombre || b.titulo || '', 'es');
            });
        }

        function crearTarjetaEjercicio(item, indexGlobal) {
            const nombre = item.nombre || item.titulo || 'Ejercicio Sin Nombre';
            const zona = item.zona_cuerpo || item.zona_corporal || item.grupo_muscular || 'General';
            const videoUrl = resolverUrlVideo(item);

            let areas = [...obtenerAreasEjercicio(item)].sort((a, b) => a.localeCompare(b, 'es'));
            if (areaFiltroActual !== 'todos') {
                const clave = normalizarTexto(areaFiltroActual);
                areas.sort((a, b) => (normalizarTexto(b).includes(clave) ? 1 : 0) - (normalizarTexto(a).includes(clave) ? 1 : 0));
            }

            const estiloBadge = 'background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;';
            const visibles = areas.slice(0, 2);
            const ocultas = areas.slice(2);

            let areasHtml = visibles
                .map(area => `<span class="badge" style="${estiloBadge}"><i class='bx bx-plus-medical'></i> ${escaparHtml(area)}</span>`)
                .join('');

            if (ocultas.length > 0) {
                const labelExtra = `+${ocultas.length} más`;
                areasHtml += `
                    <button type="button" class="badge" data-label="${escaparHtml(labelExtra)}" onclick="toggleAreasExtra(this)"
                        title="${escaparHtml(ocultas.join(', '))}"
                        style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; cursor: pointer;">
                        ${escaparHtml(labelExtra)}
                    </button>
                    <span style="display: none;">
                        ${ocultas.map(area => `<span class="badge" style="${estiloBadge}"><i class='bx bx-plus-medical'></i> ${escaparHtml(area)}</span>`).join('')}
                    </span>
                `;
            }

            const mediaChip = videoUrl
                ? `<span class="badge badge-ok" style="white-space: nowrap; flex-shrink: 0; font-size: 0.7rem;"><i class='bx bx-video'></i> Con Video</span>`
                : `<span class="badge badge-neutro" style="white-space: nowrap; flex-shrink: 0; font-size: 0.68rem; opacity: 0.78;"><i class='bx bx-file-blank'></i> Solo guía</span>`;

            const card = document.createElement('div');
            card.className = 'card';
            card.style.cssText = 'padding: 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--gris-200);';

            card.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px;">
                        <h3 style="margin: 0; font-size: 1rem; color: var(--azul-900); font-weight: 700; flex: 1; min-width: 0; line-height: 1.35;">${escaparHtml(nombre)}</h3>
                        ${mediaChip}
                    </div>
                    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
                        <span class="badge badge-neutro"><i class='bx bx-body'></i> ${escaparHtml(zona)}</span>
                        ${areasHtml}
                    </div>
                </div>
                <div style="margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--gris-100); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
                    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                        <button type="button" class="btn btn-secondary btn-sm" onclick="abrirModalInfo(${indexGlobal})">
                            <i class='bx bx-info-circle'></i> Ficha
                        </button>
                        ${videoUrl
                            ? `<button type="button" class="btn btn-secondary btn-sm" data-nombre="${escaparHtml(nombre)}" data-video="${escaparHtml(videoUrl)}" onclick="abrirModalVideo(this)"><i class='bx bx-play-circle'></i> Ver Video</button>`
                            : ''}
                    </div>
                    <a href="crear_pauta.html" class="btn btn-secondary btn-sm btn-prescribir-card">
                        <i class='bx bx-plus-circle'></i> Prescribir
                    </a>
                </div>
            `;
            return card;
        }

        async function cargarCatalogo() {
            const loading = document.getElementById('loading-ejercicios');
            const contenedor = document.getElementById('grid-catalogo-ejercicios');
            const noData = document.getElementById('no-ejercicios');
            const errorDiv = document.getElementById('error-ejercicios');
            const errorText = document.getElementById('error-text');

            loading.style.display = 'block';
            contenedor.style.display = 'none';
            noData.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                let respuesta = await api.getEjercicios();
                let acumulados = [];

                if (Array.isArray(respuesta)) {
                    acumulados = respuesta;
                } else if (respuesta && Array.isArray(respuesta.results)) {
                    acumulados = [...respuesta.results];
                    let siguienteUrl = respuesta.next;
                    let guard = 0;

                    while (siguienteUrl && guard < 10) {
                        guard++;
                        try {
                            const urlSegura = siguienteUrl.replace(/^http:\/\//i, 'https://');
                            const urlObj = new URL(urlSegura, BACKEND_ORIGIN);
                            const endpointRelativo = urlObj.pathname.replace(/^\/api\/v1/, '') + urlObj.search;
                            const paginaSig = typeof api.request === 'function'
                                ? await api.request(endpointRelativo)
                                : null;

                            if (paginaSig && Array.isArray(paginaSig.results)) {
                                acumulados.push(...paginaSig.results);
                                siguienteUrl = paginaSig.next;
                            } else {
                                break;
                            }
                        } catch (errPag) {
                            console.warn('No se pudo cargar página adicional:', errPag);
                            break;
                        }
                    }
                } else if (respuesta) {
                    acumulados = [respuesta];
                }

                catalogoCompleto = acumulados;
                loading.style.display = 'none';

                if (catalogoCompleto.length === 0) {
                    actualizarContador(0);
                    noData.style.display = 'block';
                    return;
                }

                aplicarFiltros();

            } catch (err) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorText.textContent = `Error al cargar ejercicios: ${err.message}`;
            }
        }

        function actualizarContador(cantidad) {
            const contadorEl = document.getElementById('contador-resultados-catalogo');
            if (!contadorEl) return;
            contadorEl.textContent = `Mostrando ${cantidad} de ${catalogoCompleto.length} ejercicios`;
        }

        function toggleSeccionIndividual(headerEl) {
            const grid = headerEl.nextElementSibling;
            const icono = headerEl.querySelector('.icono-acordeon');
            if (!grid) return;
            const oculto = grid.style.display === 'none';
            grid.style.display = oculto ? 'grid' : 'none';
            if (icono) icono.className = oculto ? 'bx bx-chevron-down icono-acordeon' : 'bx bx-chevron-right icono-acordeon';
        }

        function toggleTodasLasSecciones() {
            seccionesContraidas = !seccionesContraidas;
            document.querySelectorAll('.seccion-zona-grid').forEach(grid => {
                grid.style.display = seccionesContraidas ? 'none' : 'grid';
            });
            document.querySelectorAll('.icono-acordeon').forEach(icono => {
                icono.className = seccionesContraidas ? 'bx bx-chevron-right icono-acordeon' : 'bx bx-chevron-down icono-acordeon';
            });
            const btn = document.getElementById('btn-toggle-secciones');
            if (btn) {
                btn.innerHTML = seccionesContraidas
                    ? "<i class='bx bx-expand-vertical'></i> Expandir secciones"
                    : "<i class='bx bx-collapse-vertical'></i> Contraer secciones";
            }
        }

        function filtrarPorLetra(letra) {
            letraFiltroActual = letra;
            aplicarFiltros();
        }

        function actualizarBarraLetras(listaBaseSinFiltroLetra) {
            const barra = document.getElementById('barra-filtro-letras');
            const cont = document.getElementById('contenedor-pills-letras');
            if (!barra || !cont) return;

            if (ordenActual !== 'alfabetico') {
                barra.style.display = 'none';
                return;
            }

            const letrasDisponibles = Array.from(
                new Set(listaBaseSinFiltroLetra.map(obtenerLetraInicial))
            ).sort((a, b) => a.localeCompare(b, 'es'));

            barra.style.display = 'flex';
            cont.innerHTML = [
                `<button type="button" class="letra-pill-btn ${letraFiltroActual === 'todas' ? 'activa' : ''}" onclick="filtrarPorLetra('todas')">Todas</button>`,
                ...letrasDisponibles.map(l =>
                    `<button type="button" class="letra-pill-btn ${letraFiltroActual === l ? 'activa' : ''}" onclick="filtrarPorLetra('${l}')">${l}</button>`
                )
            ].join('');
        }

        function renderizarSeccionesAcordeon(gruposOrdenados, mapaGrupos, etiquetaPrefijo = '') {
            const contenedor = document.getElementById('grid-catalogo-ejercicios');
            gruposOrdenados.forEach((nombreGrupo, idxSeccion) => {
                const itemsGrupo = mapaGrupos[nombreGrupo];

                const seccion = document.createElement('section');
                seccion.style.cssText = idxSeccion === 0
                    ? 'margin-bottom: 24px;'
                    : 'margin-bottom: 24px; padding-top: 20px; border-top: 1px solid var(--gris-200);';

                const tituloMostrar = etiquetaPrefijo ? `${etiquetaPrefijo}${nombreGrupo}` : nombreGrupo;

                const header = document.createElement('div');
                header.className = 'seccion-header-acordeon';
                header.onclick = () => toggleSeccionIndividual(header);
                header.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class='bx ${seccionesContraidas ? 'bx-chevron-right' : 'bx-chevron-down'} icono-acordeon' style="font-size: 1.2rem; color: var(--azul-900);"></i>
                        <h3 style="margin: 0; font-size: 1.02rem; color: var(--azul-900); font-weight: 800;">${escaparHtml(tituloMostrar)}</h3>
                    </div>
                    <span class="badge badge-neutro">${itemsGrupo.length} ${itemsGrupo.length === 1 ? 'ejercicio' : 'ejercicios'}</span>
                `;

                const gridZona = document.createElement('div');
                gridZona.className = 'seccion-zona-grid';
                gridZona.style.cssText = `display: ${seccionesContraidas ? 'none' : 'grid'}; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;`;

                itemsGrupo.forEach(item => {
                    const idxGlobal = listaRenderizadaActual.length;
                    listaRenderizadaActual.push(item);
                    gridZona.appendChild(crearTarjetaEjercicio(item, idxGlobal));
                });

                seccion.appendChild(header);
                seccion.appendChild(gridZona);
                contenedor.appendChild(seccion);
            });
        }

        function renderizarCatalogo(lista) {
            const contenedor = document.getElementById('grid-catalogo-ejercicios');
            const noData = document.getElementById('no-ejercicios');
            const btnSecciones = document.getElementById('btn-toggle-secciones');
            const inputTexto = document.getElementById('input-buscar-catalogo');
            const hayBusquedaTexto = Boolean(inputTexto && inputTexto.value.trim());

            contenedor.innerHTML = '';
            listaRenderizadaActual = [];
            actualizarContador(lista.length);

            if (lista.length === 0) {
                if (btnSecciones) btnSecciones.style.display = 'none';
                contenedor.style.display = 'none';
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            contenedor.style.display = 'block';

            if (ordenActual === 'alfabetico') {
                if (btnSecciones) btnSecciones.style.display = 'inline-flex';
                const listaOrdenada = ordenarEjercicios(lista, false);
                const mapaLetras = {};

                listaOrdenada.forEach(item => {
                    const letra = obtenerLetraInicial(item);
                    if (!mapaLetras[letra]) mapaLetras[letra] = [];
                    mapaLetras[letra].push(item);
                });

                const letrasOrdenadas = Object.keys(mapaLetras).sort((a, b) => a.localeCompare(b, 'es'));
                renderizarSeccionesAcordeon(letrasOrdenadas, mapaLetras, 'Letra ');
                return;
            }

            const modoAgrupadoZona = ordenActual === 'zona' && zonaFiltroActual === 'todos' && !hayBusquedaTexto;
            if (btnSecciones) btnSecciones.style.display = modoAgrupadoZona ? 'inline-flex' : 'none';

            if (modoAgrupadoZona) {
                const grupos = {};
                ORDEN_ZONAS_CLINICAS.forEach(z => { grupos[z] = []; });

                lista.forEach(item => {
                    const grupo = obtenerGrupoZona(item);
                    if (!grupos[grupo]) grupos[grupo] = [];
                    grupos[grupo].push(item);
                });

                const seccionesActivas = ORDEN_ZONAS_CLINICAS.filter(z => grupos[z] && grupos[z].length > 0);
                const gruposOrdenadosFinal = {};
                seccionesActivas.forEach(z => {
                    gruposOrdenadosFinal[z] = ordenarEjercicios(grupos[z], true);
                });

                renderizarSeccionesAcordeon(seccionesActivas, gruposOrdenadosFinal);
                return;
            }

            const listaOrdenada = ordenarEjercicios(lista, ordenActual === 'video' || ordenActual === 'zona');
            const gridPlano = document.createElement('div');
            gridPlano.style.cssText = 'display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px;';

            listaOrdenada.forEach(item => {
                const idxGlobal = listaRenderizadaActual.length;
                listaRenderizadaActual.push(item);
                gridPlano.appendChild(crearTarjetaEjercicio(item, idxGlobal));
            });

            contenedor.appendChild(gridPlano);
        }

        function actualizarBotonLimpiar() {
            const inputTexto = document.getElementById('input-buscar-catalogo');
            const hayTexto = Boolean(inputTexto && inputTexto.value.trim());
            const hayFiltros = zonaFiltroActual !== 'todos' || areaFiltroActual !== 'todos' || letraFiltroActual !== 'todas' || soloConVideoActual || hayTexto;
            const btnLimpiar = document.getElementById('btn-limpiar-filtros');
            if (btnLimpiar) btnLimpiar.style.display = hayFiltros ? 'inline-flex' : 'none';
        }

        function limpiarTodosLosFiltros() {
            zonaFiltroActual = 'todos';
            areaFiltroActual = 'todos';
            letraFiltroActual = 'todas';
            soloConVideoActual = false;

            const inputTexto = document.getElementById('input-buscar-catalogo');
            if (inputTexto) inputTexto.value = '';

            const btnVideo = document.getElementById('btn-solo-video');
            if (btnVideo) btnVideo.className = 'btn btn-secondary btn-sm';

            document.querySelectorAll('#filtros-zonas-container .filtro-biomecanico-pill').forEach((btn, idx) => {
                btn.className = idx === 0 ? 'filtro-biomecanico-pill activo-todos' : 'filtro-biomecanico-pill';
            });
            document.querySelectorAll('#filtros-clinicos-container .filtro-biomecanico-pill').forEach((btn, idx) => {
                btn.className = idx === 0 ? 'filtro-biomecanico-pill activo-todos' : 'filtro-biomecanico-pill';
            });

            aplicarFiltros();
        }

        function filtrarPorZona(zona, botonElemento) {
            zonaFiltroActual = zona;

            const botones = document.querySelectorAll('#filtros-zonas-container .filtro-biomecanico-pill');
            botones.forEach(btn => btn.className = 'filtro-biomecanico-pill');
            if (botonElemento) botonElemento.classList.add('activo-todos');

            aplicarFiltros();
        }

        function filtrarPorArea(area, botonElemento) {
            areaFiltroActual = area;

            const botones = document.querySelectorAll('#filtros-clinicos-container .filtro-biomecanico-pill');
            botones.forEach(btn => btn.className = 'filtro-biomecanico-pill');
            if (botonElemento) botonElemento.classList.add('activo-todos');

            aplicarFiltros();
        }

        function toggleSoloConVideo() {
            soloConVideoActual = !soloConVideoActual;
            const btn = document.getElementById('btn-solo-video');
            if (btn) {
                btn.className = soloConVideoActual ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm';
            }
            aplicarFiltros();
        }

        function cambiarOrdenCatalogo(nuevoOrden) {
            ordenActual = nuevoOrden;
            letraFiltroActual = 'todas';
            aplicarFiltros();
        }

        function filtrarPorTexto() {
            aplicarFiltros();
        }

        function aplicarFiltros() {
            actualizarBotonLimpiar();
            const inputTexto = document.getElementById('input-buscar-catalogo');
            const termino = normalizarTexto(inputTexto ? inputTexto.value.trim() : '');

            const filtradosBase = catalogoCompleto.filter(item => {
                const nombre = normalizarTexto(item.nombre || item.titulo);
                const grupo = normalizarTexto(item.zona_cuerpo || item.zona_corporal || item.grupo_muscular);
                const patron = normalizarTexto(item.patron_movimiento || item.patron);
                const listaAreasNorm = obtenerAreasEjercicio(item).map(a => normalizarTexto(a));

                const zonaClave = normalizarTexto(zonaFiltroActual).replace(/s$/, '');
                const coincideZona =
                    zonaFiltroActual === 'todos' ||
                    (zonaFiltroActual === 'cadera'
                        ? grupo.includes('cadera') || grupo.includes('gluteo')
                        : grupo.includes(zonaClave));

                const areaClave = normalizarTexto(areaFiltroActual);
                const coincideArea =
                    areaFiltroActual === 'todos' ||
                    listaAreasNorm.some(a => a.includes(areaClave));

                const coincideVideo = !soloConVideoActual || Boolean(resolverUrlVideo(item));

                const coincideTexto = !termino ||
                    nombre.includes(termino) ||
                    grupo.includes(termino) ||
                    patron.includes(termino) ||
                    listaAreasNorm.some(a => a.includes(termino));

                return coincideZona && coincideArea && coincideVideo && coincideTexto;
            });

            actualizarBarraLetras(filtradosBase);

            const filtradosFinal = (ordenActual === 'alfabetico' && letraFiltroActual !== 'todas')
                ? filtradosBase.filter(item => obtenerLetraInicial(item) === letraFiltroActual)
                : filtradosBase;

            renderizarCatalogo(filtradosFinal);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarModalInfo();
                cerrarModalVideo();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof api !== 'undefined' && !api.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            cargarCatalogo();
        });
    </script>
