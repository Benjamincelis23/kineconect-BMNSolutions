<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Muscular y Ejercicios - KineConnect</title>
    <!-- Estilos unificados y Boxicons -->
    <link rel="stylesheet" href="public/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-shell">

        <!-- Contenido Principal -->
        <main class="main">
            <div class="content">

                <!-- Encabezado de la página -->
                <div class="page-header">
                    <div>
                        <h2>Catálogo Muscular y Ejercicios</h2>
                        <p>Consulta, filtra y gestiona la biblioteca biomecánica y clínica de ejercicios terapéuticos.</p>
                    </div>
                    <a href="crear_pauta.html" class="btn btn-primary">
                        <i class='bx bx-body'></i> Ir a Prescribir Pauta
                    </a>
                </div>

                <!-- Filtros por Zona Anatómica, Área Clínica y Buscador -->
                <div class="card" style="margin-bottom: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
                        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <span style="font-size: 0.85rem; font-weight: 700; color: var(--azul-900);">
                                <i class='bx bx-body'></i> Zona Anatómica:
                            </span>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="filtros-zonas-container">
                                <button type="button" class="filtro-biomecanico-pill activo-todos" onclick="filtrarPorZona('todos', this)">Todos</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('cuello', this)">Cuello</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('hombro', this)">Hombro</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('espalda', this)">Espalda</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('core', this)">Core</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('cadera', this)">Cadera / Glúteos</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('piernas', this)">Piernas</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('rodilla', this)">Rodilla</button>
                                <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorZona('tobillo', this)">Tobillo / Pie</button>
                            </div>
                        </div>

                        <!-- Barra de Búsqueda de Texto -->
                        <div class="field" style="margin: 0; min-width: 260px;">
                            <input type="text" id="input-buscar-catalogo"
                                placeholder="Buscar por nombre, zona o condición..." oninput="filtrarPorTexto()">
                        </div>
                    </div>

                    <!-- Filtro por Área / Condición Clínica -->
                    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--gris-100);">
                        <span style="font-size: 0.85rem; font-weight: 700; color: #0369a1;">
                            <i class='bx bx-plus-medical'></i> Condición / Área Clínica:
                        </span>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="filtros-clinicos-container">
                            <button type="button" class="filtro-biomecanico-pill activo-todos" onclick="filtrarPorArea('todos', this)">Todas</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('general', this)">Rehabilitación General</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('traumatologia', this)">Traumatología</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('inmunologia', this)">Inmunología / VIH-SIDA</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('neurologia', this)">Neurorehabilitación</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('post_operatorio', this)">Post-Operatorio</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('cardiorrespiratorio', this)">Cardiorrespiratorio</button>
                            <button type="button" class="filtro-biomecanico-pill" onclick="filtrarPorArea('geriatria', this)">Adulto Mayor</button>
                        </div>
                    </div>
                </div>

                <!-- Lista / Cuadrícula de Ejercicios -->
                <div class="card">
                    <!-- Estado de Carga -->
                    <div id="loading-ejercicios" class="empty-state">
                        <i class='bx bx-loader-alt bx-spin loading-icon'></i>
                        <p class="loading-text">Cargando catálogo biomecánico...</p>
                    </div>

                    <!-- Grid de Tarjetas de Ejercicios -->
                    <div id="grid-catalogo-ejercicios"
                        style="display: none; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px;">
                    </div>

                    <!-- Estado Vacío -->
                    <div id="no-ejercicios" class="empty-state" style="display: none;">
                        <i class='bx bx-dumbbell empty-icon'></i>
                        <p class="empty-text">No se encontraron ejercicios con los filtros seleccionados.</p>
                    </div>

                    <!-- Estado de Error -->
                    <div id="error-ejercicios" class="empty-state" style="display: none;">
                        <i class='bx bx-error-circle error-icon'></i>
                        <p id="error-text" class="error-msg-text"></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Reproductor de Video -->
    <div id="modal-video-ejercicio" onclick="if(event.target === this) cerrarModalVideo()"
        style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
        <div class="card" style="width: 100%; max-width: 720px; padding: 20px; position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 id="modal-video-titulo" style="margin: 0; color: var(--azul-900); font-size: 1.1rem;">Demostración</h3>
                <button type="button" class="btn btn-secondary btn-sm" onclick="cerrarModalVideo()">
                    <i class='bx bx-x'></i> Cerrar
                </button>
            </div>
            <video id="reproductor-ejercicio" controls playsinline style="width: 100%; max-height: 70vh; border-radius: 8px; background: #000;">
                Tu navegador no soporta la reproducción de video MP4.
            </video>
        </div>
    </div>

    <!-- Modal Información Clínica del Ejercicio -->
    <div id="modal-info-ejercicio" onclick="if(event.target === this) cerrarModalInfo()"
        style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
        <div class="card" style="width: 100%; max-width: 560px; padding: 24px; position: relative; max-height: 85vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--gris-100);">
                <div>
                    <h3 id="modal-info-titulo" style="margin: 0 0 8px 0; color: var(--azul-900); font-size: 1.15rem;"></h3>
                    <div id="modal-info-badges" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="cerrarModalInfo()">
                    <i class='bx bx-x'></i> Cerrar
                </button>
            </div>
            <div id="modal-info-contenido" style="font-size: 0.92rem; color: var(--gris-700); line-height: 1.6;"></div>
        </div>
    </div>

    <!-- Scripts Esenciales -->
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>

    <!-- Lógica de Consulta y Filtrado del Catálogo -->
    <script>
        let catalogoCompleto = [];
        let listaRenderizadaActual = [];
        let zonaFiltroActual = 'todos';
        let areaFiltroActual = 'todos';

        function escaparHtml(txt) {
            return String(txt ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function normalizarTexto(txt) {
            return String(txt ?? '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[-_]+/g, ' ')
                .trim();
        }

        function obtenerAreasEjercicio(item) {
            if (Array.isArray(item.area_clinica) && item.area_clinica.length > 0) {
                return item.area_clinica.map(a => (typeof a === 'object' ? (a.nombre || '') : String(a)));
            }
            if (typeof item.area_clinica === 'string' && item.area_clinica.trim()) {
                return [item.area_clinica];
            }
            return ['Rehabilitación General'];
        }

        function toggleAreasExtra(btn) {
            const extra = btn.nextElementSibling;
            if (!extra) return;
            const oculto = extra.style.display === 'none';
            extra.style.display = oculto ? 'contents' : 'none';
            btn.textContent = oculto ? 'Ver menos' : btn.getAttribute('data-label');
        }

        function resolverUrlVideo(item) {
            let rawUrl =
                item.video ||
                item.archivo_video ||
                item.video_file ||
                item.video_mp4 ||
                item.url_multimedia ||
                item.video_url ||
                '';

            if (!rawUrl && item && typeof item === 'object') {
                const rutaDetectada = Object.values(item).find(
                    v => typeof v === 'string' && /\.(mp4|webm|mov)($|\?)/i.test(v)
                );
                if (rutaDetectada) rawUrl = rutaDetectada;
            }

            if (!rawUrl) return '';
            if (rawUrl.startsWith('http://') || rawUrl.startsWith('https://')) return rawUrl;
            return `${BACKEND_ORIGIN}${rawUrl.startsWith('/') ? '' : '/'}${rawUrl}`;
        }

        function formatearDescripcionClinica(texto) {
            let html = escaparHtml(texto || 'Sin descripción disponible para este ejercicio terapéutico.');
            const secciones = [
                'Posición inicial:',
                'Ejecución:',
                'Ritmo y respiración:',
                'Precaución postural:'
            ];
            secciones.forEach((titulo, idx) => {
                const salto = idx === 0 ? '' : '<br><br>';
                html = html.replace(
                    titulo,
                    `${salto}<strong style="color: var(--azul-900);">${titulo}</strong>`
                );
            });
            return html;
        }

        function abrirModalInfo(index) {
            const item = listaRenderizadaActual[index];
            if (!item) return;

            const nombre = item.nombre || item.titulo || 'Ejercicio Terapéutico';
            const zona = item.zona_cuerpo || item.zona_corporal || item.grupo_muscular || 'General';
            const areas = obtenerAreasEjercicio(item);

            document.getElementById('modal-info-titulo').textContent = nombre;
            document.getElementById('modal-info-badges').innerHTML = `
                <span class="badge badge-neutro"><i class='bx bx-body'></i> ${escaparHtml(zona)}</span>
                ${areas.map(a => `<span class="badge" style="background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;"><i class='bx bx-plus-medical'></i> ${escaparHtml(a)}</span>`).join('')}
            `;
            document.getElementById('modal-info-contenido').innerHTML = formatearDescripcionClinica(item.descripcion);
            document.getElementById('modal-info-ejercicio').style.display = 'flex';
        }

        function cerrarModalInfo() {
            document.getElementById('modal-info-ejercicio').style.display = 'none';
        }

        function abrirModalVideo(boton) {
            const titulo = boton.getAttribute('data-nombre') || 'Demostración';
            const url = boton.getAttribute('data-video');
            if (!url) return;

            const modal = document.getElementById('modal-video-ejercicio');
            const tituloEl = document.getElementById('modal-video-titulo');
            const videoEl = document.getElementById('reproductor-ejercicio');

            tituloEl.textContent = titulo;
            videoEl.pause();
            videoEl.src = url;
            videoEl.load();

            modal.style.display = 'flex';
            videoEl.play().catch(() => {});
        }

        function cerrarModalVideo() {
            const modal = document.getElementById('modal-video-ejercicio');
            const videoEl = document.getElementById('reproductor-ejercicio');

            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
            modal.style.display = 'none';
        }

        async function cargarCatalogo() {
            const loading = document.getElementById('loading-ejercicios');
            const grid = document.getElementById('grid-catalogo-ejercicios');
            const noData = document.getElementById('no-ejercicios');
            const errorDiv = document.getElementById('error-ejercicios');
            const errorText = document.getElementById('error-text');

            loading.style.display = 'block';
            grid.style.display = 'none';
            noData.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                let respuesta = await api.getEjercicios();

                if (respuesta && respuesta.results) {
                    catalogoCompleto = respuesta.results;
                } else if (Array.isArray(respuesta)) {
                    catalogoCompleto = respuesta;
                } else {
                    catalogoCompleto = respuesta ? [respuesta] : [];
                }

                loading.style.display = 'none';

                if (catalogoCompleto.length === 0) {
                    noData.style.display = 'block';
                    return;
                }

                renderizarCatalogo(catalogoCompleto);

            } catch (err) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorText.textContent = `Error al cargar ejercicios: ${err.message}`;
            }
        }

        function renderizarCatalogo(lista) {
            const grid = document.getElementById('grid-catalogo-ejercicios');
            const noData = document.getElementById('no-ejercicios');

            grid.innerHTML = '';

            if (lista.length === 0) {
                listaRenderizadaActual = [];
                grid.style.display = 'none';
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            grid.style.display = 'grid';

            listaRenderizadaActual = [...lista].sort((a, b) =>
                (a.nombre || a.titulo || '').localeCompare(b.nombre || b.titulo || '', 'es')
            );

            listaRenderizadaActual.forEach((item, index) => {
                const nombre = item.nombre || item.titulo || 'Ejercicio Sin Nombre';
                const zona = item.zona_cuerpo || item.zona_corporal || item.grupo_muscular || 'General';
                const videoUrl = resolverUrlVideo(item);

                let areas = [...obtenerAreasEjercicio(item)].sort((a, b) => a.localeCompare(b, 'es'));
                if (areaFiltroActual !== 'todos') {
                    const clave = normalizarTexto(areaFiltroActual);
                    areas.sort((a, b) => (normalizarTexto(b).includes(clave) ? 1 : 0) - (normalizarTexto(a).includes(clave) ? 1 : 0));
                }

                const estiloBadge = 'background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;';
                const visibles = areas.slice(0, 2);
                const ocultas = areas.slice(2);

                let areasHtml = visibles
                    .map(area => `<span class="badge" style="${estiloBadge}"><i class='bx bx-plus-medical'></i> ${escaparHtml(area)}</span>`)
                    .join('');

                if (ocultas.length > 0) {
                    const labelExtra = `+${ocultas.length} más`;
                    areasHtml += `
                        <button type="button" class="badge" data-label="${escaparHtml(labelExtra)}" onclick="toggleAreasExtra(this)"
                            title="${escaparHtml(ocultas.join(', '))}"
                            style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; cursor: pointer;">
                            ${escaparHtml(labelExtra)}
                        </button>
                        <span style="display: none;">
                            ${ocultas.map(area => `<span class="badge" style="${estiloBadge}"><i class='bx bx-plus-medical'></i> ${escaparHtml(area)}</span>`).join('')}
                        </span>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.style.cssText = 'padding: 18px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--gris-200);';

                card.innerHTML = `
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px;">
                            <h3 style="margin: 0; font-size: 1.05rem; color: var(--azul-900); font-weight: 700;">${escaparHtml(nombre)}</h3>
                            ${videoUrl ? `<span class="badge badge-ok">Con Video</span>` : ''}
                        </div>
                        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
                            <span class="badge badge-neutro"><i class='bx bx-body'></i> ${escaparHtml(zona)}</span>
                            ${areasHtml}
                        </div>
                    </div>
                    <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--gris-100); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="abrirModalInfo(${index})">
                                <i class='bx bx-info-circle'></i> Información
                            </button>
                            ${videoUrl
                                ? `<button type="button" class="btn btn-secondary btn-sm" data-nombre="${escaparHtml(nombre)}" data-video="${escaparHtml(videoUrl)}" onclick="abrirModalVideo(this)"><i class='bx bx-video'></i> Ver Video</button>`
                                : ''}
                        </div>
                        <a href="crear_pauta.html" class="btn btn-primary btn-sm">
                            <i class='bx bx-plus-circle'></i> Prescribir
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarPorZona(zona, botonElemento) {
            zonaFiltroActual = zona;

            const botones = document.querySelectorAll('#filtros-zonas-container .filtro-biomecanico-pill');
            botones.forEach(btn => btn.className = 'filtro-biomecanico-pill');
            if (botonElemento) botonElemento.classList.add('activo-todos');

            aplicarFiltros();
        }

        function filtrarPorArea(area, botonElemento) {
            areaFiltroActual = area;

            const botones = document.querySelectorAll('#filtros-clinicos-container .filtro-biomecanico-pill');
            botones.forEach(btn => btn.className = 'filtro-biomecanico-pill');
            if (botonElemento) botonElemento.classList.add('activo-todos');

            aplicarFiltros();
        }

        function filtrarPorTexto() {
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const inputTexto = document.getElementById('input-buscar-catalogo');
            const termino = normalizarTexto(inputTexto ? inputTexto.value.trim() : '');

            const filtrados = catalogoCompleto.filter(item => {
                const nombre = normalizarTexto(item.nombre || item.titulo);
                const grupo = normalizarTexto(item.zona_cuerpo || item.zona_corporal || item.grupo_muscular);
                const patron = normalizarTexto(item.patron_movimiento || item.patron);
                const listaAreasNorm = obtenerAreasEjercicio(item).map(a => normalizarTexto(a));

                const zonaClave = normalizarTexto(zonaFiltroActual).replace(/s$/, '');
                const coincideZona =
                    zonaFiltroActual === 'todos' ||
                    (zonaFiltroActual === 'cadera'
                        ? grupo.includes('cadera') || grupo.includes('gluteo')
                        : grupo.includes(zonaClave));

                const areaClave = normalizarTexto(areaFiltroActual);
                const coincideArea =
                    areaFiltroActual === 'todos' ||
                    listaAreasNorm.some(a => a.includes(areaClave));

                const coincideTexto = !termino ||
                    nombre.includes(termino) ||
                    grupo.includes(termino) ||
                    patron.includes(termino) ||
                    listaAreasNorm.some(a => a.includes(termino));

                return coincideZona && coincideArea && coincideTexto;
            });

            renderizarCatalogo(filtrados);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarModalInfo();
                cerrarModalVideo();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof api !== 'undefined' && !api.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            cargarCatalogo();
        });
    </script>
</body>

</html>
