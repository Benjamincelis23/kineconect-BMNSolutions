<body>
    <div class="app-shell">
        <!-- Sidebar de Navegación -->

    <!-- Cliente API de Frontend servido por Vite -->
    <script src="/js/api.js"></script>
    <script>
        // Lógica de autenticación de la página
        document.addEventListener('DOMContentLoaded', () => {
            if (!api.isAuthenticated()) {
                window.location.href = '/index.html';
                return;
            }
            const user = api.getUser();
            const userTag = document.getElementById('user-display');
            if (user && userTag) {
                userTag.textContent = user.nombre_completo || user.username || 'Usuario';
            }
        });

        // Variables globales (Reemplazo manual del tag de Django para que tu script externo funcione)
        const URIs = {
            pautas: "/pautas.html"
        };
    </script>
